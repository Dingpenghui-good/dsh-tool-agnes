# Cordis bundle patch for @dingpenghui/agnes-video.
#
# Mounted either as a profile bundle (via package.json `dsh.bundle.patch`) or
# explicitly from a profile's cordis.patch.yml:
#
#   - insert:
#       - id: tool-agnes-video
#         name: '@dingpenghui/agnes-video'
#         config:
#           model: agnes-video-v2.0
#
# Every key the row owns must be restated, because a patch replaces the
# targeted row's whole config.
- id: tool-agnes-video
  name: '@dingpenghui/agnes-video'
  config:
    model: agnes-video-v2.0
    pollIntervalMs: 5000
    timeoutMs: 600000
    maxConsecutiveFailures: 4
    ferryContext: true
